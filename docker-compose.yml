services:
  postgres:
    image: postgres:16-alpine
    container_name: luxlane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxlane
      POSTGRES_PASSWORD: luxlane
      POSTGRES_DB: luxlane
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
